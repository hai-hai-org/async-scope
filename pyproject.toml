[project]
name = "asyncscope"
version = "0.1.0"
description = "Async bottleneck profiler for ASGI apps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"  # sys.monitoring
dependencies = []           # ponytail: pure ASGI middleware, no runtime deps yet

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ruff>=0.7",
    # adapter classifier가 감싸는 진입점이 실제로 존재하는지 검증하는 용도.
    # 실행에는 필요 없다 (dependencies = [] 유지). 검사는 importorskip으로 감싼다.
    "asyncpg>=0.30",
    "redis>=5",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asyncscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
