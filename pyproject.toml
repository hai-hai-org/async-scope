[project]
name = "asyncscope-tracer"  # PyPI 배포명. import는 asyncscope 그대로다
version = "0.1.0"
description = "Async execution tracer for ASGI apps — see what blocks the event loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"  # sys.monitoring
dependencies = []           # ponytail: pure ASGI middleware, no runtime deps yet
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/hai-hai-org/async-scope"
Issues = "https://github.com/hai-hai-org/async-scope/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ruff>=0.7",
    # adapter classifier가 감싸는 진입점이 실제로 존재하는지 검증하는 용도.
    # 실행에는 필요 없다 (dependencies = [] 유지). 검사는 importorskip으로 감싼다.
    "asyncpg>=0.30",
    "redis>=5",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# 대시보드 빌드 결과는 .gitignore 대상이라 hatchling이 기본으로 뺀다. 조용히 빠지면
# wheel에 UI가 없는 채로 나가므로 명시한다.
artifacts = ["src/asyncscope/web/static/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/asyncscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
