name: Bug Report
description: 버그를 신고합니다
labels: ["bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 단계를 적어주세요
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: "Python 3.11, FastAPI 0.110"
